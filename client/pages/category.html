<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Category — AgroShield</title>
  <meta name="description" content="Browse AgroShield product categories — Seeds, Pesticides, Fertilizers and Farming Essentials — with subcategory browsing, search and sorting." />
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <script defer src="/js/api.js"></script>
  <script defer src="/js/store.js"></script>
  <script defer src="/js/ui.js"></script>
  <script defer src="/js/taxonomy.js"></script>
  <script defer src="/js/category.js"></script>
</head>
<body>
  <div id="site-nav"></div>

  <main id="main">
    <!-- ============ CATEGORY HEADER ============ -->
    <section class="section section--tight cat-hero-wrap">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="/pages/home.html">Home</a>
          <span aria-hidden="true">/</span>
          <a href="/pages/products.html">All Products</a>
          <span aria-hidden="true">/</span>
          <span id="crumb-type">Category</span>
          <span class="hidden" id="crumb-sub-wrap"><span aria-hidden="true">/</span> <span id="crumb-sub"></span></span>
        </nav>
        <div class="cat-hero">
          <img id="cat-hero-img" src="/images/categories/field-crop-seeds.jpg" alt="" />
          <div>
            <span class="eyebrow" id="cat-eyebrow">Category</span>
            <h1 id="cat-title">Loading…</h1>
            <p id="cat-sub"></p>
            <p class="cat-count" id="cat-count"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ SUBCATEGORY SLIDER (hidden for Farming Essentials) ============ -->
    <section class="section section--tight hidden" id="subcat-section">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow">Browse by subcategory</span>
            <h2 id="subcat-heading">Subcategories</h2>
          </div>
          <div class="carousel__nav">
            <button class="carousel__btn" type="button" data-prev aria-label="Scroll subcategories left">‹</button>
            <button class="carousel__btn" type="button" data-next aria-label="Scroll subcategories right">›</button>
          </div>
        </div>
        <div class="carousel" data-carousel id="subcat-carousel">
          <div class="carousel__track subcat-track" id="subcat-track">
            <!-- filled by category.js -->
          </div>
        </div>
      </div>
    </section>

    <!-- ============ PRODUCTS ============ -->
    <section class="section" id="products-section">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow" id="explore-eyebrow">Explore</span>
            <h2 id="explore-title">Products</h2>
          </div>
          <div class="cat-toolbar">
            <input class="input" type="search" id="cat-search" placeholder="Search products…" aria-label="Search products in this category" />
            <select class="input" id="cat-sort" aria-label="Sort products">
              <option value="default" selected>Recommended</option>
              <option value="featured">Featured</option>
              <option value="price_asc">Price: low to high</option>
              <option value="price_desc">Price: high to low</option>
              <option value="name_asc">Name: A–Z</option>
              <option value="rating">Rating</option>
            </select>
          </div>
        </div>

        <div class="loading-row" id="cat-loader"><div class="spinner"></div></div>
        <div class="product-grid hidden" id="cat-grid"></div>
        <div class="empty-state hidden" id="cat-empty">
          <p id="cat-empty-text">No products found in this section yet.</p>
          <a class="btn btn--primary btn--sm" href="/pages/products.html">Browse all products</a>
        </div>
        <div class="load-more-row">
          <p class="text-muted" id="cat-shown"></p>
          <button class="btn btn--outline" type="button" id="cat-more" hidden>Load more products</button>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
