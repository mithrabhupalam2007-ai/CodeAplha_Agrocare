<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Wishlist — AgroShield</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <script defer src="/js/api.js"></script>
  <script defer src="/js/store.js"></script>
  <script defer src="/js/ui.js"></script>
  <script defer src="/js/wishlist.js"></script>
</head>
<body>
  <div id="site-nav"></div>

  <main id="main">
    <section class="page-head">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="/pages/home.html">Home</a><span>/</span><span class="current">Wishlist</span>
        </nav>
        <h1>My Wishlist</h1>
        <p>Products you saved for later — availability is always live from the store database.</p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="loading-row" id="loader"><div class="spinner"></div></div>

        <div class="product-grid hidden" id="wishlist-grid"></div>

        <div class="empty hidden" id="wishlist-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
          <h3>Your wishlist is empty</h3>
          <p>Tap the heart on any product to save it here for later.</p>
          <a class="btn btn--primary" href="/pages/products.html">Browse products</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
